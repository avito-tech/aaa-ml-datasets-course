[tool.poetry]
name = "aaa-ml-datasets-course"
version = "1.0.0"
description = "Репозиторий курса по созданию датасетов Академии Аналитиков Авито"
authors = ["Avito"]

packages = [
    { include = "heuristics", from = "."},
]
exclude = [
    "**/*.ipynb",    
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "2.2.3"
matplotlib = "3.8.4"
seaborn = "0.13.2"
scipy = "1.13.1"
numpy = "1.26.4"
scikit-learn = "1.4.2"
transformers = "4.39.3"
tensorboard = "2.16.2"
nltk = "3.8.1"
torch = "2.2.2"
torchvision = "0.17.2"
protobuf = "4.25.3"
opencv-python = "4.9.0.80"

toloka-kit = "1.2.1"
tqdm = "4.67.1"
ipykernel = "6.29.4"
notebook = "7.4.1"
ipywidgets = "8.1.6"

together = "1.4.6"
dotenv = "0.9.9"

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
